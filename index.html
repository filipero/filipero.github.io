<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filipe</title>
    <meta name="description" content="Simple GitHub Pages site for app-ads.txt hosting.">
    <style>
        :root {
            color-scheme: light dark;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: Canvas;
            color: CanvasText;
        }

        main {
            width: min(640px, calc(100% - 32px));
        }

        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            letter-spacing: 0;
        }

        p {
            margin: 0 0 16px;
        }

        a {
            color: LinkText;
        }
    </style>
</head>

<body>
    <main>
        <h1>Filipe</h1>
        <p>This GitHub Pages site hosts public app seller information.</p>
        <p><a href="/app-ads.txt">View app-ads.txt</a></p>
    </main>
</body>

</html>
